<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Gracias por registrarte! - Autos Amistosos</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        /* Estilos generales del fondo (similar al formulario) */
        html, body {
            height: 100%;
            margin: 0;
            font-family: 'Arial', sans-serif;
            background-color: #e0f7fa; /* Fondo azul claro */
        }
        .main-wrapper {
            display: flex; 
            justify-content: center;
            align-items: center;
            min-height: 100vh; /* Asegura que ocupe toda la altura */
            padding: 20px;
        }
        /* Contenedor de la tarjeta de agradecimiento */
        .card-agradecimiento {
            width: 100%;
            max-width: 500px; 
            padding: 40px;
            background-color: white; 
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        .icon {
            font-size: 4rem;
            color: #28a745; /* Verde de éxito */
            margin-bottom: 20px;
        }
        .title {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
            color: #1f3a5f; 
            margin-bottom: 15px;
        }
        .btn-primary {
            background-color: #1f3a5f; /* Azul Oscuro para el botón principal */
            border-color: #1f3a5f;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    
    <div class="main-wrapper">
        <div class="card-agradecimiento">
            <div class="icon">
                <span class="text-success">🎉</span>
            </div>
            
            <h1 class="title">¡Registro Exitoso!</h1>
            
            <p class="lead">
                Gracias por registrar tu interés en **Autos Amistosos**.
            </p>
            
            <p>
                Hemos recibido tus datos y un **vendedor calificado** se pondrá en contacto contigo a la brevedad a través de tu email para darte seguimiento personalizado.
            </p>
            
            <hr>
            
            <a href="../../index.html" class="btn btn-primary btn-lg">
                Volver al Inicio
            </a>
            
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
