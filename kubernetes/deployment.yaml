apiVersion: apps/v1
kind: Deployment
metadata:
  name: autos-amistosos-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: autos-amistosos
  template:
    metadata:
      labels:
        app: autos-amistosos
    spec:
      containers:
      - name: autos-amistosos
        image: dianaort/proyecto_autos_amistosos:latest
        ports:
        - containerPort: 3000